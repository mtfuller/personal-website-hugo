<script>
  (function () {
    var root = document.documentElement;
    var buttons = document.querySelectorAll('[data-theme-toggle]');
    var meta = document.querySelector('meta[name="theme-color"]');

    function current() { return root.getAttribute('data-theme') === 'light' ? 'light' : 'dark'; }
    function sync() {
      var next = current() === 'light' ? 'dark' : 'light';
      for (var i = 0; i < buttons.length; i++) {
        buttons[i].setAttribute('aria-label', 'Switch to ' + next + ' theme');
        buttons[i].setAttribute('title', 'Switch to ' + next + ' theme');
      }
      if (meta) meta.setAttribute('content', current() === 'light' ? '#F7F7F8' : '#1E1E25');
    }
    function apply(theme) { root.setAttribute('data-theme', theme); sync(); }

    for (var i = 0; i < buttons.length; i++) {
      buttons[i].addEventListener('click', function () {
        var next = current() === 'light' ? 'dark' : 'light';
        apply(next);
        try { localStorage.setItem('theme', next); } catch (e) {}
      });
    }

    // Follow the system setting until the visitor chooses a theme.
    if (window.matchMedia) {
      var mq = window.matchMedia('(prefers-color-scheme: light)');
      var onChange = function (e) {
        var saved = null;
        try { saved = localStorage.getItem('theme'); } catch (err) {}
        if (!saved) apply(e.matches ? 'light' : 'dark');
      };
      if (mq.addEventListener) mq.addEventListener('change', onChange);
      else if (mq.addListener) mq.addListener(onChange);
    }
    sync();
  })();

  (function () {
    var button = document.querySelector('[data-nav-toggle]');
    var menu = document.getElementById('nav-links');
    if (!button || !menu) return;

    function setOpen(open) {
      menu.classList.toggle('is-open', open);
      button.setAttribute('aria-expanded', open ? 'true' : 'false');
      button.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    }

    button.addEventListener('click', function () {
      setOpen(button.getAttribute('aria-expanded') !== 'true');
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && button.getAttribute('aria-expanded') === 'true') {
        setOpen(false);
        button.focus();
      }
    });
    // Close the menu if the window grows past the mobile breakpoint.
    if (window.matchMedia) {
      var wide = window.matchMedia('(min-width: 721px)');
      var onWide = function (e) { if (e.matches) setOpen(false); };
      if (wide.addEventListener) wide.addEventListener('change', onWide);
      else if (wide.addListener) wide.addListener(onWide);
    }
  })();
</script>
