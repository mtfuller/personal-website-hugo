<section class="contact" aria-labelledby="contact-band-title">
  <div class="wrap inner">
    <div class="titles">
      <p class="label">Contact</p>
      <h2 class="h2" id="contact-band-title">Building something that moves money? Let's talk.</h2>
      {{- with site.Params.email }}
      <a class="note" href="mailto:{{ . }}">{{ . }}</a>
      {{- end }}
    </div>
    <div class="actions">
      <a class="btn btn-primary" href="{{ "contact/" | relURL }}">Send a message</a>
      {{- with site.Params.linkedin }}
      <a class="btn btn-ghost" href="{{ . }}" target="_blank" rel="noopener">LinkedIn ↗</a>
      {{- end }}
    </div>
  </div>
</section>
