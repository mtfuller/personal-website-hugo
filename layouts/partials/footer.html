<footer class="site-footer">
  <div class="wrap">
    <span>© {{ now.Year }} {{ site.Params.author }}</span>
    <nav aria-label="Elsewhere">
      {{- with site.Params.linkedin }}<a href="{{ . }}" target="_blank" rel="me noopener">LinkedIn</a>{{ end }}
      {{- with site.Params.github }}<a href="{{ . }}" target="_blank" rel="me noopener">GitHub</a>{{ end }}
      {{- with site.GetPage "/blog" }}{{ with .OutputFormats.Get "rss" }}<a href="{{ .RelPermalink }}">RSS</a>{{ end }}{{ end }}
    </nav>
    <span>{{ site.Params.location }} · {{ site.Params.coordinates }}</span>
  </div>
</footer>
