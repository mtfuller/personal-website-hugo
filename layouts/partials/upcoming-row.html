{{- /* A post that is still being written (from data/upcoming.yaml). Not a link. */ -}}
<article class="row">
  <div class="row-meta">
    <span class="primary draft">Draft</span>
    <span class="secondary">In progress</span>
  </div>
  <div class="row-body">
    <h3 class="title">{{ .title }}</h3>
    <p class="snippet">{{ .snippet }}</p>
    {{- partial "tag-list.html" (dict "tags" .tags "link" false) }}
  </div>
</article>
