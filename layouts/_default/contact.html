{{ define "main" }}
<div class="wrap contact-page">
  <div class="intro">
    <div class="prose">{{ .Content }}</div>
    <div class="direct">
      {{- with site.Params.email }}<a class="link" href="mailto:{{ . }}">{{ . }}</a>{{ end }}
      {{- with site.Params.linkedin }}<a class="link" href="{{ . }}" target="_blank" rel="me noopener">LinkedIn ↗</a>{{ end }}
      {{- with site.Params.github }}<a class="link" href="{{ . }}" target="_blank" rel="me noopener">GitHub ↗</a>{{ end }}
    </div>
  </div>

  <form class="form" action="{{ site.Params.formspree }}" method="POST" accept-charset="utf-8">
    <div class="pair">
      <label class="field" for="name">Name
        <input id="name" name="name" type="text" autocomplete="name" placeholder="Jordan Lee" required>
      </label>
      <label class="field" for="email">Email
        <input id="email" name="email" type="email" autocomplete="email" placeholder="jordan@company.com" required>
      </label>
    </div>
    <label class="field" for="reason">What's this about?
      <select id="reason" name="reason" required>
        <option>Hiring or a role</option>
        <option>Payments architecture</option>
        <option>AI and agentic development</option>
        <option>Speaking or a podcast</option>
        <option>Just saying hi</option>
        <option>Something else</option>
      </select>
    </label>
    <label class="field" for="message">Message
      <textarea id="message" name="message" required></textarea>
    </label>
    <input type="hidden" name="_subject" value="New message from thomasfuller.codes">
    {{- with site.Params.recaptchaSiteKey }}
    <div class="g-recaptcha" data-sitekey="{{ . }}"></div>
    {{- end }}
    <button class="btn btn-primary" type="submit">Send message</button>
  </form>
</div>

{{- if site.Params.recaptchaSiteKey }}
<script>
  // Match the reCAPTCHA widget to the current theme, and require it before submit.
  (function () {
    var box = document.querySelector('.g-recaptcha');
    if (box) box.setAttribute('data-theme', document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark');
    window.addEventListener('load', function () {
      var el = document.getElementById('g-recaptcha-response');
      if (el) el.setAttribute('required', 'required');
    });
  })();
</script>
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
{{- end }}
{{ end }}
