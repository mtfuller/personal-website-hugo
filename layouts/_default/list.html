{{ define "main" }}
<div class="wrap section">
  {{- if eq .Kind "taxonomy" }}
  <div class="term-cloud">
    {{- range .Data.Terms.ByCount }}
    <a class="tag" href="{{ .Page.RelPermalink }}">{{ .Page.Title }}<span class="count">{{ .Count }}</span></a>
    {{- end }}
  </div>
  {{- else }}
  {{- with .Content }}<div class="prose">{{ . }}</div>{{ end }}
  <div class="rows">
    {{- range .Pages }}{{ partial "post-row.html" . }}{{ end }}
  </div>
  {{- end }}
</div>
{{ end }}
